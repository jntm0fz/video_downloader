name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE (完整版, 内置 ffmpeg)
        run: python -m PyInstaller --clean --noconfirm bilibili.spec

      - name: Build EXE (轻量版, 不含 ffmpeg)
        env:
          BILIBILI_LITE: "1"
        run: python -m PyInstaller --clean --noconfirm --distpath dist_lite bilibili.spec

      - name: Upload GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/video-downloader.exe
            dist_lite/video-downloader-lite.exe
          generate_release_notes: true
